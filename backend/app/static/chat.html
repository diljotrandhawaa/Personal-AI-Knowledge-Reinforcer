<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .chat-container {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
        }

        .document-panel {
            padding: 15px;
            margin-bottom: 20px;
            background: #f8fafc;
            border: 1px solid #dddddd;
            border-radius: 8px;
        }

        .document-panel h2 {
            margin-top: 0;
            font-size: 18px;
        }

        #upload-status {
            margin-bottom: 0;
        }

        .success-text {
            color: #166534;
        }

        .error-text {
            color: #991b1b;
        }

        #messages {
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .user {
            background: #dbeafe;
            margin-left: 20%;
        }

        .assistant {
            background: #eeeeee;
            margin-right: 20%;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <h1>Personal AI Agent</h1>

        <div class="document-panel">
            <h2>Upload Knowledge</h2>

            <form id="upload-form">
                <input
                    id="document-file"
                    type="file"
                    accept=".txt,.pdf"
                    required
                >

                <button id="upload-button" type="submit">
                    Upload
                </button>
            </form>

            <p id="upload-status"></p>
        </div>

        <div id="messages">
            <div class="message assistant">
                Ask me something about your stored knowledge.
            </div>
        </div>

        <form id="chat-form">
            <input
                id="question"
                type="text"
                placeholder="Enter your question..."
                required
            >
            <button id="send-button" type="submit">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("question");
        const button = document.getElementById("send-button");
        const messages = document.getElementById("messages");
        const uploadForm = document.getElementById("upload-form");
        const documentFile = document.getElementById("document-file");
        const uploadButton = document.getElementById("upload-button");
        const uploadStatus = document.getElementById("upload-status");

        function addMessage(text, messageType) {
            const message = document.createElement("div");

            message.className = `message ${messageType}`;
            message.textContent = text;

            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;

            return message;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const question = input.value.trim();

            if (!question) {
                return;
            }

            addMessage(question, "user");

            input.value = "";
            button.disabled = true;

            const loadingMessage = addMessage(
                "Generating answer...",
                "assistant"
            );

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                loadingMessage.remove();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "The request failed."
                    );
                }

                addMessage(data.answer, "assistant");
            } catch (error) {
                loadingMessage.remove();
                addMessage(error.message, "error");
            } finally {
                button.disabled = false;
                input.focus();
            }
        });
        uploadForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const selectedFile = documentFile.files[0];

            if (!selectedFile) {
                return;
            }

            const formData = new FormData();
            formData.append("file", selectedFile);

            uploadButton.disabled = true;
            uploadStatus.className = "";
            uploadStatus.textContent = "Uploading and processing document...";

            try {
                const response = await fetch("/ingest", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Document upload failed."
                    );
                }

                uploadStatus.className = "success-text";
                uploadStatus.textContent =
                    `${data.filename} was ingested successfully.`;

                documentFile.value = "";
            } catch (error) {
                uploadStatus.className = "error-text";
                uploadStatus.textContent = error.message;
            } finally {
                uploadButton.disabled = false;
            }
        });
    </script>
</body>
</html>
